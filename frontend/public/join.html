<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRO TRED — Ro'yxatdan o'tish</title>
  <style>
    :root { --bg:#0b0f17; --panel:#121826; --panel2:#1a2233; --line:#223049; --txt:#e6edf7; --muted:#8b98b0; --green:#22c55e; --gold:#d4af37; --red:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; padding:24px; }
    .join { width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; }
    h1 { font-size:20px; color:var(--gold); margin-bottom:4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
    label { display:block; color:var(--muted); font-size:12px; margin:12px 0 5px; }
    input { width:100%; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
    button { width:100%; margin-top:18px; background:var(--green); color:#0b0f17; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .msg { margin-top:14px; font-size:13px; }
    .ok { color:var(--green); }
    .err { color:var(--red); }
    .code { font-family:monospace; font-weight:700; background:var(--gold); color:#0b0f17; border-radius:8px; padding:2px 10px; font-size:18px; letter-spacing:3px; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <div class="join">
    <h1>PRO TRED AI METAL TRADER</h1>
    <div class="sub">Yagona tizimga ro'yxatdan o'ting — 5 xonali kod oling va Telegram botga ulaning.</div>

    <label>Login (kamida 3 ta belgi)</label>
    <input id="username" autocomplete="username" />
    <label>Ism (ixtiyoriy)</label>
    <input id="name" />
    <label>Telefon (ixtiyoriy)</label>
    <input id="phone" />
    <label>Parol (kamida 4 ta belgi)</label>
    <input id="password" type="password" autocomplete="new-password" />

    <button id="submit" onclick="register()">Ro'yxatdan o'tish</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    async function register() {
      const body = { username: $('username').value.trim(), name: $('name').value.trim(), phone: $('phone').value.trim(), password: $('password').value }
      $('submit').disabled = true
      $('msg').className = 'msg'
      try {
        const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        const data = await res.json()
        if (!res.ok || !data.ok) throw new Error((data.detail || data.error) || 'Xatolik')
        $('msg').innerHTML = `<span class="ok">✅ Muvaffaqiyatli!</span><br><br>
          Telegram botga ulanish uchun 5 xonali kod:<br>
          <span class="code">—</span><br>
          <span class="muted">Kodni bot orqali: /link &lt;kod&gt; deb yuboring.</span>`
        // kodni olish uchun login qilamiz
        try {
          const l = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: body.username, password: body.password }) })
          const ld = await l.json()
          if (ld.ok) {
            const me = await fetch('/api/me', { headers: { 'X-User-Token': ld.user.token } })
            const md = await me.json()
            if (md.account && md.account.link_code) {
              $('msg').innerHTML = `<span class="ok">✅ Muvaffaqiyatli ro'yxatdan o'tdingiz!</span><br><br>
                Telegram botga ulanish kodi:<br>
                <span class="code">${md.account.link_code}</span><br><span class="muted">Botda /link ${md.account.link_code} deb yozing.</span>`
            }
          }
        } catch (e) { /* qoldiq */ }
      } catch (e) {
        $('msg').innerHTML = `<span class="err">❌ ${e.message}</span>`
      } finally {
        $('submit').disabled = false
      }
    }
  </script>
</body>
</html>
